version: "2"
linters:
  default: none
  enable:
    - govet
  settings:
    staticcheck:
      checks:
        - -SA5011
    govet:
      disable:
        - inline
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 3
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
